# Rebuilds splycehousereviews.com whenever reviews.json (or the build script)
# changes on main, commits the result, and asks GitHub Pages to republish.
name: Build and publish

on:
  push:
    branches: [main]
    paths:
      - reviews.json
      - build.py
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the page from reviews.json
        run: python3 build.py

      - name: Commit the rebuilt files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html llms.txt robots.txt sitemap.xml
            git commit -m "Rebuild page from reviews.json"
            git push
          fi

      - name: Ask GitHub Pages to republish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
