# Rebuilds splycehousereviews.com and publishes it to GitHub Pages
# whenever reviews.json (or the build script) changes on main.
name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the page from reviews.json
        run: python3 build.py

      - name: Commit the rebuilt files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html llms.txt robots.txt sitemap.xml
            git commit -m "Rebuild page from reviews.json"
            git push
          fi

      - name: Package the site
        run: |
          mkdir -p _site
          cp -r index.html llms.txt robots.txt sitemap.xml CNAME .nojekyll assets _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
